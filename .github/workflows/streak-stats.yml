name: Update GitHub Streak Stats

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate streak stats
        # pinned: main @ 2026-07-28 (post-v1.7.0); bump SHA deliberately to upgrade
        uses: DenverCoder1/github-readme-streak-stats@a028da8aed0700a4d4cbe90f3482c2a2ee6188df
        with:
          # JSON, not a query string: the YAML `>` folded scalar joins lines with
          # spaces, which corrupted query-string values (theme became "dark ").
          options: >
            {
              "user": "${{ github.repository_owner }}",
              "theme": "dark",
              "hide_border": "true",
              "border_radius": "12",
              "disable_animations": "false",
              "date_format": "M j[, Y]"
            }
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          git diff --cached --quiet && exit 0

          git commit -m "chore: update GitHub streak stats"
          git push
